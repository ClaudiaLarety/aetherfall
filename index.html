<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aetherfall</title>
<style>
  body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
  #info { position: absolute; top: 10px; left: 10px; color: white; background: rgba(0,0,0,0.4); padding: 8px 12px; border-radius: 6px; }
  #msg { position: absolute; top: 40%; width: 100%; text-align: center; color: white; font-size: 3rem; font-weight: bold; text-shadow: 2px 2px 6px black; }
</style>
</head>
<body>
<div id="info"><b>Aetherfall</b><br>Move: W A S D or arrow keys<br>Jump: Space<br>Coins: <span id="score">0</span> / <span id="total">0</span><br>Time: <span id="timer">0.0</span>s<br>Best: <span id="best">--</span></div>
<div id="msg"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const msg = document.getElementById("msg");

const scene = new THREE.Scene();
const skyLow = new THREE.Color(0x87ceeb);
const skyHigh = new THREE.Color(0xff9a76);
const skyNow = new THREE.Color(0x87ceeb);
scene.background = skyNow;
scene.fog = new THREE.Fog(0x87ceeb, 40, 110);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 0.8);
sun.position.set(10, 20, 10);
scene.add(sun);

// Platforms: x, y, z (centre), width, height, depth
// Moving platforms add: axis ("x" or "z"), range, speed
const platformData = [
  [0, 0, 0, 12, 1, 12],
  [0, 1, -12, 8, 1, 8],
  [6, 2, -21, 8, 1, 8, "x", 4, 1.2],
  [0, 3, -30, 7, 1, 7],
  [-7, 4, -39, 7, 1, 7, "x", 4, 1.5],
  [0, 5, -48, 10, 1, 10]
];
const platforms = [];
platformData.forEach(([x, y, z, w, h, d, axis, range, speed], i) => {
  const isGoal = i === platformData.length - 1;
  let color = 0x2ecc71;
  if (axis) color = 0x3498db;
  if (isGoal) color = 0xf1c40f;
  const geo = new THREE.BoxGeometry(w, h, d);
  const mesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color: color }));
  mesh.position.set(x, y, z);
  const edges = new THREE.LineSegments(
    new THREE.EdgesGeometry(geo),
    new THREE.LineBasicMaterial({ color: 0x1b2631 })
  );
  mesh.add(edges);
  scene.add(mesh);
  platforms.push({ x, y, z, w, h, d, baseX: x, baseZ: z, axis, range, speed, dx: 0, dz: 0, mesh });
});

// Clouds
function makeCloud(x, y, z, s) {
  const g = new THREE.Group();
  const mat = new THREE.MeshLambertMaterial({ color: 0xffffff });
  [[0, 0, 0, 1.6], [1.6, -0.2, 0.3, 1.2], [-1.6, -0.2, -0.2, 1.3], [0.6, 0.6, 0, 1.1]].forEach(([cx, cy, cz, r]) => {
    const m = new THREE.Mesh(new THREE.SphereGeometry(r, 12, 10), mat);
    m.position.set(cx, cy, cz);
    g.add(m);
  });
  g.position.set(x, y, z);
  g.scale.setScalar(s);
  scene.add(g);
  return g;
}
const clouds = [
  makeCloud(-18, 2, -10, 1.2),
  makeCloud(20, 6, -25, 1.5),
  makeCloud(-25, 8, -40, 1.8),
  makeCloud(22, 10, -55, 1.4),
  makeCloud(0, -6, -20, 2),
  makeCloud(-14, -8, -45, 2.2)
];

// Coins
const coins = [];
platformData.forEach(([x, y, z, w, h, d], i) => {
  if (i === 0) return;
  const geo = new THREE.CylinderGeometry(0.4, 0.4, 0.12, 20);
  geo.rotateX(Math.PI / 2);
  const coin = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color: 0xffd700 }));
  coin.position.set(x, y + h / 2 + 1, z);
  coin.userData.plat = platforms[i];
  scene.add(coin);
  coins.push(coin);
});
let collected = 0;
const scoreEl = document.getElementById("score");
document.getElementById("total").textContent = coins.length;

// Player character (centre of the group is the centre of a 1x1x1 box)
const player = new THREE.Group();
const skinMat = new THREE.MeshLambertMaterial({ color: 0xffcc99 });
const shirtMat = new THREE.MeshLambertMaterial({ color: 0xe74c3c });
const pantsMat = new THREE.MeshLambertMaterial({ color: 0x2c3e50 });
const darkMat = new THREE.MeshLambertMaterial({ color: 0x111111 });

const torso = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.45, 0.35), shirtMat);
player.add(torso);

const head = new THREE.Mesh(new THREE.SphereGeometry(0.24, 16, 12), skinMat);
head.position.y = 0.48;
player.add(head);

const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.04, 8, 8), darkMat);
eyeL.position.set(-0.09, 0.52, -0.21);
player.add(eyeL);
const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.04, 8, 8), darkMat);
eyeR.position.set(0.09, 0.52, -0.21);
player.add(eyeR);

function makeLimb(x, y, width, length, mat) {
  const pivot = new THREE.Group();
  pivot.position.set(x, y, 0);
  const m = new THREE.Mesh(new THREE.BoxGeometry(width, length, width), mat);
  m.position.y = -length / 2;
  pivot.add(m);
  player.add(pivot);
  return pivot;
}
const legL = makeLimb(-0.15, -0.2, 0.22, 0.3, pantsMat);
const legR = makeLimb(0.15, -0.2, 0.22, 0.3, pantsMat);
const armL = makeLimb(-0.4, 0.17, 0.14, 0.4, skinMat);
const armR = makeLimb(0.4, 0.17, 0.14, 0.4, skinMat);

scene.add(player);
const start = { x: 0, y: 1.5, z: 0 };
player.position.set(start.x, start.y, start.z);
let walkPhase = 0;

// Blob shadow under the player
const shadow = new THREE.Mesh(
  new THREE.CircleGeometry(0.5, 20),
  new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.3 })
);
shadow.rotation.x = -Math.PI / 2;
scene.add(shadow);

let vy = 0;
let onGround = false;
const SPEED = 8;
const JUMP = 13;
const GRAVITY = 28;

const keys = {};
window.addEventListener("keydown", e => { keys[e.code] = true; });
window.addEventListener("keyup", e => { keys[e.code] = false; });

let timerRunning = false;
let finished = false;
let elapsed = 0;
let gameTime = 0;
const timerEl = document.getElementById("timer");
const bestEl = document.getElementById("best");
let best = null;
try { best = parseFloat(localStorage.getItem("aetherfallBest")) || null; } catch (e) {}
if (best) bestEl.textContent = best.toFixed(1);

function update(dt) {
  gameTime += dt;
  platforms.forEach(p => {
    if (!p.axis) return;
    const offset = Math.sin(gameTime * p.speed) * p.range;
    const newX = p.axis === "x" ? p.baseX + offset : p.baseX;
    const newZ = p.axis === "z" ? p.baseZ + offset : p.baseZ;
    p.dx = newX - p.x;
    p.dz = newZ - p.z;
    p.x = newX;
    p.z = newZ;
    p.mesh.position.x = newX;
    p.mesh.position.z = newZ;
  });

  clouds.forEach(c => {
    c.position.x += dt * 0.5;
    if (c.position.x > 35) c.position.x = -35;
  });

  let dx = 0;
  let dz = 0;
  if (keys["KeyW"] || keys["ArrowUp"]) dz -= 1;
  if (keys["KeyS"] || keys["ArrowDown"]) dz += 1;
  if (keys["KeyA"] || keys["ArrowLeft"]) dx -= 1;
  if (keys["KeyD"] || keys["ArrowRight"]) dx += 1;
  const moving = dx !== 0 || dz !== 0;
  if (moving) {
    const len = Math.hypot(dx, dz);
    player.position.x += (dx / len) * SPEED * dt;
    player.position.z += (dz / len) * SPEED * dt;
    player.rotation.y = Math.atan2(-dx, -dz);
  }
  if (keys["Space"] && onGround) {
    vy = JUMP;
    onGround = false;
  }

  if (!finished && (moving || keys["Space"])) timerRunning = true;
  if (timerRunning && !finished) {
    elapsed += dt;
    timerEl.textContent = elapsed.toFixed(1);
  }

  const prevBottom = player.position.y - 0.5;
  vy -= GRAVITY * dt;
  player.position.y += vy * dt;
  onGround = false;

  platforms.forEach((p, i) => {
    const top = p.y + p.h / 2;
    const overX = Math.abs(player.position.x - p.x) < p.w / 2 + 0.5;
    const overZ = Math.abs(player.position.z - p.z) < p.d / 2 + 0.5;
    const bottom = player.position.y - 0.5;
    if (overX && overZ && vy <= 0 && prevBottom >= top - 0.01 && bottom <= top) {
      player.position.y = top + 0.5;
      player.position.x += p.dx;
      player.position.z += p.dz;
      vy = 0;
      onGround = true;
      if (i === platforms.length - 1 && !finished) {
        finished = true;
        let text = "You made it! 🎉 " + elapsed.toFixed(1) + "s";
        if (!best || elapsed < best) {
          best = elapsed;
          bestEl.textContent = best.toFixed(1);
          try { localStorage.setItem("aetherfallBest", best); } catch (e) {}
          text += " (new best!)";
        }
        msg.textContent = text;
      }
    }
  });

  // Walking and jumping animation
  if (moving && onGround) walkPhase += dt * 12;
  const swing = moving && onGround ? Math.sin(walkPhase) * 0.8 : 0;
  legL.rotation.x = swing;
  legR.rotation.x = -swing;
  armL.rotation.x = onGround ? -swing : 2.6;
  armR.rotation.x = onGround ? swing : 2.6;

  // Shadow
  let shadowY = null;
  const feet = player.position.y - 0.5;
  platforms.forEach(p => {
    const top = p.y + p.h / 2;
    const overX = Math.abs(player.position.x - p.x) < p.w / 2;
    const overZ = Math.abs(player.position.z - p.z) < p.d / 2;
    if (overX && overZ && top <= feet + 0.05) {
      if (shadowY === null || top > shadowY) shadowY = top;
    }
  });
  if (shadowY === null) {
    shadow.visible = false;
  } else {
    shadow.visible = true;
    shadow.position.set(player.position.x, shadowY + 0.02, player.position.z);
    const s = Math.max(0.4, 1 - (feet - shadowY) * 0.08);
    shadow.scale.set(s, s, s);
  }

  for (let i = coins.length - 1; i >= 0; i--) {
    const c = coins[i];
    c.position.x = c.userData.plat.x;
    c.position.z = c.userData.plat.z;
    c.rotation.y += dt * 3;
    if (c.position.distanceTo(player.position) < 1.1) {
      scene.remove(c);
      coins.splice(i, 1);
      collected++;
      scoreEl.textContent = collected;
    }
  }

  if (player.position.y < -15) {
    player.position.set(start.x, start.y, start.z);
    vy = 0;
    msg.textContent = "";
    timerRunning = false;
    finished = false;
    elapsed = 0;
    timerEl.textContent = "0.0";
  }
}

function updateSky() {
  const t = Math.min(Math.max(player.position.y / 6, 0), 1);
  skyNow.lerpColors(skyLow, skyHigh, t);
  scene.fog.color.copy(skyNow);
}

function updateCamera() {
  camera.position.set(player.position.x, player.position.y + 6, player.position.z + 10);
  camera.lookAt(player.position.x, player.position.y, player.position.z - 3);
}

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  update(Math.min(clock.getDelta(), 0.05));
  updateSky();
  updateCamera();
  renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
